services:
  postgres:
    image: postgres:16-alpine
    container_name: novia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=novia
      - POSTGRES_PASSWORD=novia
      - POSTGRES_DB=novia
    volumes:
      - novia_pgdata:/var/lib/postgresql/data

  novia:
    build: .
    container_name: novia
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DATABASE_URL=postgresql://novia:novia@postgres:5432/novia
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  novia_pgdata:
